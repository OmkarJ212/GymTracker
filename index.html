<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Iron Log</title>

<!-- PWA & Apple Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">

<!-- Favicon, Apple Touch Icon, and Manifest -->
<link rel="icon" type="image/png" href="/GymTracker/icon.png">
<link rel="apple-touch-icon" href="/GymTracker/icon.png">
<link rel="manifest" href="/GymTracker/manifest.json">

<style>
  :root{
    --bg:#121316;
    --surface:#1c1e22;
    --surface2:#24272c;
    --surface3:#2c2f35;
    --border:#2c2f35;
    --text:#ededee;
    --text-dim:#8b8d93;
    --text-faint:#5b5d63;
    --accent:#ff6a3d;
    --accent-dim:#7a3a26;
    --pr:#3ddc97;
    --danger:#ff5566;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-variant-numeric:tabular-nums;
    overscroll-behavior:none;
    user-select:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  input{font-variant-numeric:tabular-nums;}
  #app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}

  /* ---------- Header ---------- */
  header{
    padding:18px 18px 12px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20; background:var(--bg);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:baseline; gap:8px;}
  .brand .mark{width:9px;height:9px;background:var(--accent);border-radius:2px; display:inline-block; margin-right:2px;}
  .brand h1{font-size:19px; letter-spacing:0.5px; margin:0; font-weight:800;}
  .brand .date{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .session-btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:9px 14px; border-radius:20px; font-size:13px; font-weight:600;
    display:flex; align-items:center; gap:7px; cursor:pointer;
  }
  .session-btn.active{background:var(--accent); border-color:var(--accent); color:#1b0d06;}
  .session-btn .dot{width:6px;height:6px;border-radius:50%;background:var(--text-faint);}
  .session-btn.active .dot{background:#1b0d06; animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- Search / chips ---------- */
  .toolbar{padding:14px 18px 6px;}
  .search{
    width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:11px 14px; color:var(--text); font-size:15px; outline:none;
  }
  .search::placeholder{color:var(--text-faint);}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:12px 18px 4px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:16px; font-size:12.5px; font-weight:600;
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim); white-space:nowrap; cursor:pointer;
  }
  .chip.active{background:var(--surface3); color:var(--text); border-color:var(--accent-dim);}

  /* ---------- Exercise list ---------- */
  main{flex:1; padding:6px 18px 100px;}
  .group-label{font-size:11.5px; letter-spacing:1.2px; color:var(--text-faint); font-weight:700; margin:18px 4px 8px; text-transform:uppercase;}
  .ex-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 15px; margin-bottom:9px; display:flex; align-items:center; justify-content:space-between;
    transition:background .15s, transform .1s; cursor:pointer;
  }
  .ex-card:active{transform:scale(.98); background:var(--surface2);}
  .ex-info{display:flex; flex-direction:column; gap:5px; min-width:0;}
  .ex-name{font-size:15.5px; font-weight:600;}
  .ex-meta{font-size:12px; color:var(--text-dim); display:flex; gap:8px; align-items:center;}
  .plates{display:flex; gap:3px;}
  .plate{width:6px;height:12px;border-radius:1px;background:var(--surface3);}
  .plate.filled{background:var(--accent);}
  .chev{color:var(--text-faint); font-size:20px; margin-left:8px;}
  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty-state .big{font-size:34px; margin-bottom:10px;}

  .fab{
    position:fixed; right:18px; bottom:calc(24px + env(safe-area-inset-bottom));
    width:54px; height:54px; border-radius:50%; background:var(--accent); color:#1b0d06;
    font-size:28px; display:flex; align-items:center; justify-content:center; font-weight:400;
    box-shadow:0 8px 24px rgba(255,106,61,.35); z-index:15; border:none; cursor:pointer;
  }

  /* ---------- Sheet (exercise detail) ---------- */
  .sheet-scrim{
    position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:30; opacity:0; pointer-events:none;
    transition:opacity .22s;
  }
  .sheet-scrim.open{opacity:1; pointer-events:auto;}
  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:520px; margin:0 auto;
    background:var(--bg); border-radius:20px 20px 0 0; border:1px solid var(--border); border-bottom:none;
    z-index:31; max-height:92vh; display:flex; flex-direction:column;
    transform:translateY(100%); transition:transform .28s cubic-bezier(.32,.72,0,1);
    touch-action: pan-y;
  }
  .sheet.open{transform:translateY(0);}
  .sheet-handle{
    width:36px; height:4px; background:var(--surface3); border-radius:2px; margin:10px auto 4px;
    touch-action: none; cursor: grab;
  }
  .sheet-head{
    padding:6px 20px 14px; display:flex; align-items:flex-start; justify-content:space-between;
    border-bottom:1px solid var(--border); touch-action: none;
  }
  .sheet-title{font-size:20px; font-weight:800;}
  .sheet-sub{font-size:12.5px; color:var(--text-dim); margin-top:4px;}
  .sheet-close{
    background:var(--surface); border:1px solid var(--border); color:var(--text-dim);
    width:30px; height:30px; border-radius:50%; font-size:15px; display:flex;
    align-items:center; justify-content:center; cursor:pointer;
  }
  .sheet-body{overflow-y:auto; padding:16px 20px 24px; -webkit-overflow-scrolling:touch;}

  .pr-banner{
    background:linear-gradient(90deg, rgba(61,220,151,.12), transparent);
    border:1px solid rgba(61,220,151,.3); color:var(--pr); border-radius:10px; padding:9px 12px;
    font-size:12.5px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px;
  }

  .set-row{
    display:grid; grid-template-columns:28px 1fr 1fr 34px; gap:10px; align-items:center;
    padding:9px 0; border-bottom:1px solid var(--border);
  }
  .set-row:last-child{border-bottom:none;}
  .set-idx{font-size:13px; color:var(--text-faint); font-weight:700;}
  .set-field{display:flex; flex-direction:column; gap:3px;}
  .set-field label{font-size:10px; color:var(--text-faint); letter-spacing:.5px; text-transform:uppercase;}
  .set-field input{
    background:var(--surface); border:1px solid var(--border); border-radius:9px; color:var(--text);
    font-size:16px; font-weight:700; padding:9px 10px; width:100%; outline:none;
  }
  .set-field input:focus{border-color:var(--accent);}
  .set-del{color:var(--text-faint); background:none; border:none; font-size:18px; padding:6px; cursor:pointer;}
  .set-row.is-pr .set-field:first-of-type input{border-color:var(--pr); color:var(--pr);}

  .add-set-btn{
    width:100%; margin-top:12px; padding:12px; border-radius:12px; border:1px dashed var(--border);
    background:none; color:var(--accent); font-weight:700; font-size:14px; cursor:pointer;
  }
  .add-set-btn:active{background:var(--surface);}

  .row2{display:flex; gap:10px; margin-top:16px;}
  .unit-toggle{display:flex; background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; font-size:13px; font-weight:700;}
  .unit-toggle button{flex:1; padding:9px 0; background:none; border:none; color:var(--text-dim); cursor:pointer;}
  .unit-toggle button.active{background:var(--surface3); color:var(--text);}

  .history-block{margin-top:22px;}
  .history-title{font-size:12px; letter-spacing:1px; text-transform:uppercase; color:var(--text-faint); font-weight:700; margin-bottom:10px;}
  .chart{display:flex; align-items:flex-end; gap:6px; height:70px; padding:0 2px;}
  .bar{flex:1; background:var(--surface3); border-radius:3px 3px 0 0; position:relative; min-height:3px;}
  .bar.top{background:var(--accent);}
  .chart-labels{display:flex; gap:6px; margin-top:6px;}
  .chart-labels span{flex:1; text-align:center; font-size:9.5px; color:var(--text-faint);}
  .hist-empty{font-size:13px; color:var(--text-faint); padding:10px 0;}
  .best-stat{display:flex; gap:18px; margin-top:14px;}
  .best-stat div{flex:1; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .best-stat .n{font-size:19px; font-weight:800;}
  .best-stat .l{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; margin-top:2px;}

  /* rest timer toast */
  .rest-toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%, 130%);
    background:var(--surface2); border:1px solid var(--accent-dim); border-radius:14px;
    padding:12px 18px; display:flex; align-items:center; gap:14px; z-index:40;
    transition:transform .25s cubic-bezier(.32,.72,0,1); box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .rest-toast.show{transform:translate(-50%, 0);}
  .rest-ring{width:38px;height:38px;flex:0 0 auto;}
  .rest-toast .t{font-size:20px; font-weight:800; font-variant-numeric:tabular-nums;}
  .rest-toast .lbl{font-size:11px; color:var(--text-dim);}
  .rest-toast button{background:var(--surface3); border:none; color:var(--text-dim); border-radius:8px; padding:6px 10px; font-size:12px; font-weight:700; cursor:pointer;}

  /* add exercise sheet form */
  .field{margin-bottom:14px;}
  .field label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.5px; font-weight:700;}
  .field input, .field select{
    width:100%; margin-top:6px; background:var(--surface); border:1px solid var(--border); border-radius:10px;
    color:var(--text); padding:11px 12px; font-size:15px; outline:none;
  }
  .primary-btn{
    width:100%; padding:14px; border-radius:12px; border:none; background:var(--accent); color:#1b0d06;
    font-weight:800; font-size:15px; margin-top:6px; cursor:pointer;
  }

  /* ---------- Tab bar ---------- */
  .tabbar{display:flex; gap:6px; padding:12px 18px 0; background:var(--bg);}
  .tab{
    flex:1; text-align:center; padding:10px 0; border-radius:11px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-dim); font-size:13.5px; font-weight:700; cursor:pointer;
  }
  .tab.active{background:var(--surface3); color:var(--text); border-color:var(--accent-dim);}

  /* ---------- Today's plan strip ---------- */
  .today-plan{padding:14px 18px 2px;}
  .today-plan-label{font-size:11.5px; letter-spacing:1.2px; color:var(--text-faint); font-weight:700; margin-bottom:8px; text-transform:uppercase;}
  .today-plan-row{display:flex; gap:8px; overflow-x:auto; scrollbar-width:none;}
  .today-plan-row::-webkit-scrollbar{display:none;}
  .today-chip{
    flex:0 0 auto; padding:9px 14px; border-radius:12px; background:var(--surface); border:1px solid var(--accent-dim);
    font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; cursor:pointer;
  }

  /* ---------- Weekly plan view & Individual Day Tables ---------- */
  #planView{padding:14px 18px 100px;}
  .day-card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:14px 15px; margin-bottom:14px;
  }
  .day-card.is-today{border-color:var(--accent-dim);}
  .day-card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .day-name{font-size:15.5px; font-weight:800; display:flex; align-items:center; gap:8px;}
  .day-name .today-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
  .day-label-input{
    background:none; border:none; color:var(--text-dim); font-size:12.5px; text-align:right; outline:none;
    max-width:140px; padding:4px 0;
  }
  .day-label-input::placeholder{color:var(--text-faint);}
  
  .day-chips{display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px;}
  .day-chip{
    display:flex; align-items:center; gap:7px; background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; padding:7px 8px 7px 11px; font-size:12.5px; font-weight:600; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .day-chip:active{background:var(--surface3); border-color:var(--accent-dim);}
  .day-chip-name{display:flex; align-items:center; gap:6px;}
  .day-chip-del{background:none; border:none; color:var(--text-faint); font-size:15px; padding:2px 4px; cursor:pointer;}
  .day-chip-del:hover{color:var(--danger);}

  .day-table-wrap{
    margin-top:10px; border-top:1px solid var(--border); padding-top:10px; overflow-x:auto; scrollbar-width:thin;
  }
  .log-table{width:100%; border-collapse:collapse; font-size:12.5px; text-align:left;}
  .log-table th{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--text-faint);
    padding:6px 8px; border-bottom:1px solid var(--border); font-weight:700;
  }
  .log-table td{padding:8px; border-bottom:1px solid var(--border); color:var(--text);}
  .log-table tr:last-child td{border-bottom:none;}
  .log-table .col-ex{font-weight:600;}
  .log-table .col-sets{color:var(--text-dim); font-size:11.5px;}
  .log-table .col-top{font-weight:700; color:var(--accent);}

  .day-add-btn{
    margin-top:11px; width:100%; padding:9px; border-radius:10px; border:1px dashed var(--border);
    background:none; color:var(--accent); font-weight:700; font-size:13px; cursor:pointer;
  }
  .day-empty{font-size:12.5px; color:var(--text-faint); margin-top:8px;}

  /* ---------- Plan picker sheet ---------- */
  .picker-row{
    display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .picker-row .pname{font-size:14.5px; font-weight:600;}
  .picker-row .pcat{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .picker-check{
    width:26px; height:26px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:14px; color:transparent; flex:0 0 auto;
  }
  .picker-check.on{background:var(--accent); border-color:var(--accent); color:#1b0d06;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <div>
        <h1><span class="mark"></span>IRON LOG</h1>
        <div class="date" id="todayLabel"></div>
      </div>
    </div>
    <button class="session-btn" id="sessionBtn"><span class="dot"></span><span id="sessionBtnLabel">Start workout</span></button>
  </header>

  <div class="tabbar">
    <button class="tab active" data-tab="log">Log</button>
    <button class="tab" data-tab="plan">Weekly Plan</button>
  </div>

  <div id="logView">
    <div class="today-plan" id="todayPlanWrap" style="display:none;">
      <div class="today-plan-label">Today's plan</div>
      <div class="today-plan-row" id="todayPlanRow"></div>
    </div>

    <div class="toolbar">
      <input class="search" id="searchInput" placeholder="Search exercises…" />
    </div>
    <div class="chips" id="chips"></div>

    <main id="listWrap"></main>

    <button class="fab" id="addExerciseFab">+</button>
  </div>

  <div id="planView" style="display:none;"></div>
</div>

<div class="sheet-scrim" id="scrim"></div>

<!-- Exercise detail sheet -->
<div class="sheet" id="detailSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div>
      <div class="sheet-title" id="detailName">—</div>
      <div class="sheet-sub" id="detailSub">—</div>
    </div>
    <button class="sheet-close" id="detailClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="pr-banner" id="prBanner" style="display:none;">🏆 <span id="prBannerText"></span></div>
    <div class="row2">
      <div class="unit-toggle" id="unitToggle" style="flex:1;">
        <button data-unit="kg">KG</button>
        <button data-unit="lb">LB</button>
      </div>
    </div>
    <div id="setsWrap" style="margin-top:16px;"></div>
    <button class="add-set-btn" id="addSetBtn">+ Add set</button>

    <div class="best-stat">
      <div><div class="n" id="statBest">—</div><div class="l">Best set</div></div>
      <div><div class="n" id="statLast">—</div><div class="l">Last session</div></div>
    </div>

    <div class="history-block">
      <div class="history-title">Top set — last 8 sessions</div>
      <div id="chartWrap"></div>
    </div>
  </div>
</div>

<!-- Add exercise sheet -->
<div class="sheet" id="addSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div><div class="sheet-title">New exercise</div></div>
    <button class="sheet-close" id="addClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field">
      <label>Name</label>
      <input id="newExName" placeholder="e.g. Incline Dumbbell Press" />
    </div>
    <div class="field">
      <label>Category</label>
      <select id="newExCat"></select>
    </div>
    <button class="primary-btn" id="saveNewEx">Add exercise</button>
  </div>
</div>

<!-- Day exercise picker sheet -->
<div class="sheet" id="pickerSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-head">
    <div><div class="sheet-title" id="pickerTitle">Add exercises</div><div class="sheet-sub">Tap to add or remove</div></div>
    <button class="sheet-close" id="pickerClose">✕</button>
  </div>
  <div class="sheet-body">
    <div class="field" style="margin-bottom:6px;">
      <input class="search" id="pickerSearch" placeholder="Search exercises…" style="margin-top:0;" />
    </div>
    <div id="pickerList"></div>
  </div>
</div>

<div class="rest-toast" id="restToast">
  <svg class="rest-ring" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="17" fill="none" stroke="#2c2f35" stroke-width="4"/>
    <circle id="restRingFg" cx="20" cy="20" r="17" fill="none" stroke="#ff6a3d" stroke-width="4"
      stroke-dasharray="106.8" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 20 20)"/>
  </svg>
  <div>
    <div class="t" id="restTime">1:30</div>
    <div class="lbl">Rest timer</div>
  </div>
  <button id="restSkip">Skip</button>
</div>

<script>
/* ---------------- Offline Service Worker ---------------- */
if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('/GymTracker/sw.js', { scope: '/GymTracker/' }).catch(function(err) {});
  });
}

(function(){
  "use strict";

  /* ---------------- Data ---------------- */
  var DEFAULT_EXERCISES = [
    {id:"bench-press", name:"Barbell Bench Press", cat:"Chest"},
    {id:"incline-db-press", name:"Incline Chest Press Machine", cat:"Chest"},
    {id:"chest-press-machine", name:"Chest Press Machine", cat:"Chest"},
    {id:"chest-fly", name:"Cable Chest Fly", cat:"Chest"},
    {id:"push-up", name:"Push-Up", cat:"Chest"},
    {id:"deadlift", name:"Deadlift", cat:"Back"},
    {id:"pull-up", name:"Assisted Pull-up Machine", cat:"Back"},
    {id:"barbell-row", name:"Barbell Row", cat:"Back"},
    {id:"lat-pulldown", name:"Lat Pulldown / Alternative", cat:"Back"},
    {id:"seated-row", name:"Seated Row Machine", cat:"Back"},
    {id:"squat", name:"Barbell Back Squat", cat:"Legs"},
    {id:"hack-squat-machine", name:"Hack Squat Machine", cat:"Legs"},
    {id:"leg-press", name:"Leg Press", cat:"Legs"},
    {id:"romanian-deadlift", name:"Romanian Deadlift", cat:"Legs"},
    {id:"leg-curl", name:"Seated Leg Curl", cat:"Legs"},
    {id:"leg-extension", name:"Leg Extension", cat:"Legs"},
    {id:"calf-raise", name:"Calf Raise Machine", cat:"Legs"},
    {id:"lunge", name:"Walking Lunge", cat:"Legs"},
    {id:"ohp", name:"Shoulder Press Machine", cat:"Shoulders"},
    {id:"lateral-raise", name:"Lateral Raise Machine / Dumbbell Lateral Raise", cat:"Shoulders"},
    {id:"rear-delt-fly", name:"Rear Delt Fly Machine", cat:"Shoulders"},
    {id:"face-pull", name:"Face Pull", cat:"Shoulders"},
    {id:"barbell-curl", name:"Barbell Curl", cat:"Arms"},
    {id:"hammer-curl", name:"Hammer Curl", cat:"Arms"},
    {id:"preacher-curl-machine", name:"Preacher Curl Machine", cat:"Arms"},
    {id:"tricep-pushdown", name:"Tricep Pushdown", cat:"Arms"},
    {id:"skull-crusher", name:"Skull Crusher", cat:"Arms"},
    {id:"plank", name:"Plank", cat:"Core"},
    {id:"hanging-leg-raise", name:"Hanging Knee Raises", cat:"Core"},
    {id:"cable-crunch", name:"Cable Crunch", cat:"Core"},
    {id:"treadmill", name:"Treadmill Run", cat:"Cardio"},
    {id:"incline-treadmill-walk", name:"Incline Treadmill Walk", cat:"Cardio"},
    {id:"cycling", name:"Cycling", cat:"Cardio"},
    {id:"rowing-machine", name:"Rowing Machine", cat:"Cardio"}
  ];
  var CATS = ["All","Chest","Back","Legs","Shoulders","Arms","Core","Cardio"];

  /* ---------------- Storage ---------------- */
  var LS_KEY = "ironlog.v1";
  function loadState(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return {
      customExercises: [],
      unit: "kg",
      restSeconds: 90,
      logs: {},
      activeSession: null,
      weeklyPlan: {0:[],1:[],2:[],3:[],4:[],5:[],6:[]},
      dayLabels: {0:"",1:"",2:"",3:"",4:"",5:"",6:""}
    };
  }
  var state = loadState();
  if(!state.weeklyPlan) state.weeklyPlan = {0:[],1:[],2:[],3:[],4:[],5:[],6:[]};
  if(!state.dayLabels) state.dayLabels = {0:"",1:"",2:"",3:"",4:"",5:"",6:""};
  function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }

  function allExercises(){ return DEFAULT_EXERCISES.concat(state.customExercises); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtDateShort(str){
    var d = new Date(str+"T00:00:00");
    return d.toLocaleDateString(undefined,{month:"short", day:"numeric"});
  }

  /* ---------------- Header / session ---------------- */
  var todayLabel = document.getElementById("todayLabel");
  todayLabel.textContent = new Date().toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"});

  var sessionBtn = document.getElementById("sessionBtn");
  var sessionBtnLabel = document.getElementById("sessionBtnLabel");
  function renderSessionBtn(){
    if(state.activeSession){
      sessionBtn.classList.add("active");
      sessionBtnLabel.textContent = "Workout active";
    } else {
      sessionBtn.classList.remove("active");
      sessionBtnLabel.textContent = "Start workout";
    }
  }
  sessionBtn.addEventListener("click", function(){
    if(state.activeSession){
      state.activeSession = null;
    } else {
      state.activeSession = {date: todayStr()};
    }
    save(); renderSessionBtn();
  });
  renderSessionBtn();

  /* ---------------- Chips / search / list ---------------- */
  var activeCat = "All";
  var searchTerm = "";
  var chipsWrap = document.getElementById("chips");
  CATS.forEach(function(c){
    var el = document.createElement("div");
    el.className = "chip" + (c===activeCat ? " active":"");
    el.textContent = c;
    el.addEventListener("click", function(){
      activeCat = c;
      Array.from(chipsWrap.children).forEach(function(ch){ ch.classList.remove("active"); });
      el.classList.add("active");
      renderList();
    });
    chipsWrap.appendChild(el);
  });

  document.getElementById("searchInput").addEventListener("input", function(e){
    searchTerm = e.target.value.trim().toLowerCase();
    renderList();
  });

  function lastLogFor(id){
    var arr = state.logs[id];
    if(!arr || !arr.length) return null;
    return arr[arr.length-1];
  }
  function bestWeightFor(id){
    var arr = state.logs[id];
    if(!arr) return null;
    var best = null;
    arr.forEach(function(sess){
      sess.sets.forEach(function(s){
        var wKg = toKg(s.w, s.unit);
        if(best===null || wKg > best) best = wKg;
      });
    });
    return best;
  }
  function bestHistoricalWeightFor(id, targetDate){
    var arr = state.logs[id];
    if(!arr) return null;
    var best = null;
    var target = targetDate || todayStr();
    arr.filter(function(s){ return s.date !== target; }).forEach(function(sess){
      sess.sets.forEach(function(s){
        var wKg = toKg(s.w, s.unit);
        if(best === null || wKg > best) best = wKg;
      });
    });
    return best;
  }
  function toKg(w, unit){ return unit === "lb" ? (parseFloat(w)||0)*0.453592 : (parseFloat(w)||0); }
  function fromKg(wKg, unit){ return unit === "lb" ? (parseFloat(wKg)||0)/0.453592 : (parseFloat(wKg)||0); }

  var listWrap = document.getElementById("listWrap");
  function renderList(){
    var items = allExercises().filter(function(ex){
      var catOk = activeCat === "All" || ex.cat === activeCat;
      var searchOk = !searchTerm || ex.name.toLowerCase().indexOf(searchTerm) > -1;
      return catOk && searchOk;
    });
    listWrap.innerHTML = "";
    if(!items.length){
      listWrap.innerHTML = '<div class="empty-state"><div class="big">🏋️</div>No exercises found.<br>Try a different search or add a custom one.</div>';
      return;
    }
    var byCat = {};
    items.forEach(function(ex){ (byCat[ex.cat] = byCat[ex.cat]||[]).push(ex); });
    var order = activeCat === "All" ? CATS.slice(1) : [activeCat];
    order.forEach(function(cat){
      var arr = byCat[cat];
      if(!arr || !arr.length) return;
      var label = document.createElement("div");
      label.className = "group-label";
      label.textContent = cat;
      listWrap.appendChild(label);
      arr.forEach(function(ex){
        listWrap.appendChild(buildExCard(ex));
      });
    });
  }

  function buildExCard(ex){
    var card = document.createElement("div");
    card.className = "ex-card";
    var last = lastLogFor(ex.id);
    var todaysSets = (function(){
      var t = todayStr();
      var arr = state.logs[ex.id];
      if(!arr) return 0;
      var sess = arr.find(function(s){ return s.date === t; });
      return sess ? sess.sets.length : 0;
    })();
    var plateHtml = "";
    for(var i=0;i<5;i++){ plateHtml += '<span class="plate'+(i<todaysSets?" filled":"")+'"></span>'; }
    var metaText = last ? (last.sets.length + " sets last time") : "Not logged yet";
    card.innerHTML =
      '<div class="ex-info">'+
        '<div class="ex-name">'+escapeHtml(ex.name)+'</div>'+
        '<div class="ex-meta"><span>'+metaText+'</span><span class="plates">'+plateHtml+'</span></div>'+
      '</div><div class="chev">›</div>';
    card.addEventListener("click", function(){ openDetail(ex, todayStr()); });
    return card;
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  /* ---------------- Detail sheet ---------------- */
  var scrim = document.getElementById("scrim");
  var detailSheet = document.getElementById("detailSheet");
  var addSheet = document.getElementById("addSheet");
  var pickerSheet = document.getElementById("pickerSheet");
  var currentEx = null;
  var currentLogDate = todayStr();
  var draftSets = [];

  function openSheet(sheet){
    scrim.classList.add("open");
    sheet.classList.add("open");
    sheet.style.transform = "translateY(0)";
  }
  function closeSheets(){
    scrim.classList.remove("open");
    [detailSheet, addSheet, pickerSheet].forEach(function(s){
      s.classList.remove("open");
      s.style.transform = "";
    });
    renderPlanView();
    renderTodayPlan();
    renderList();
  }
  scrim.addEventListener("click", closeSheets);
  document.getElementById("detailClose").addEventListener("click", closeSheets);
  document.getElementById("addClose").addEventListener("click", closeSheets);
  document.getElementById("pickerClose").addEventListener("click", closeSheets);

  var unitToggle = document.getElementById("unitToggle");
  Array.from(unitToggle.children).forEach(function(btn){
    btn.addEventListener("click", function(){
      var oldUnit = state.unit;
      var newUnit = btn.getAttribute("data-unit");
      if(oldUnit === newUnit) return;
      
      state.unit = newUnit;
      draftSets.forEach(function(s){
        if(s.w !== "" && !isNaN(parseFloat(s.w))){
          s.w = round1(fromKg(toKg(parseFloat(s.w), oldUnit), newUnit));
        }
      });
      save();
      renderUnitToggle();
      renderSets();
      renderStatsAndChart();
      persistDraft();
    });
  });
  function renderUnitToggle(){
    Array.from(unitToggle.children).forEach(function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-unit")===state.unit);
    });
  }

  function openDetail(ex, targetDate){
    currentEx = ex;
    currentLogDate = targetDate || todayStr();
    document.getElementById("detailName").textContent = ex.name;
    var isToday = currentLogDate === todayStr();
    document.getElementById("detailSub").textContent = ex.cat + " · " + (isToday ? "Today's Log" : "Logging for " + fmtDateShort(currentLogDate));
    renderUnitToggle();

    var arr = state.logs[ex.id];
    var targetSess = arr ? arr.find(function(s){ return s.date===currentLogDate; }) : null;
    if(targetSess && targetSess.sets && targetSess.sets.length > 0){
      draftSets = targetSess.sets.map(function(s){ return {w: round1(fromKg(toKg(s.w,s.unit), state.unit)), r: s.r}; });
    } else {
      var last = lastLogFor(ex.id);
      if(last && last.sets.length){
        var lastSet = last.sets[last.sets.length-1];
        draftSets = [{w: round1(fromKg(toKg(lastSet.w,lastSet.unit), state.unit)), r: lastSet.r}];
      } else {
        draftSets = [{w:"", r:""}];
      }
    }
    renderSets();
    renderStatsAndChart();
    openSheet(detailSheet);
  }
  function round1(n){ return Math.round(n*10)/10; }

  var setsWrap = document.getElementById("setsWrap");
  function renderSets(){
    setsWrap.innerHTML = "";
    var priorBest = bestHistoricalWeightFor(currentEx.id, currentLogDate);

    draftSets.forEach(function(set, idx){
      var row = document.createElement("div");
      row.className = "set-row";
      var currentWKg = toKg(set.w, state.unit);
      var isPr = priorBest !== null && set.w !== "" && currentWKg > priorBest && (parseFloat(set.w) || 0) > 0;
      if(isPr) row.classList.add("is-pr");
      
      row.innerHTML =
        '<div class="set-idx">'+(idx+1)+'</div>'+
        '<div class="set-field"><label>Weight ('+state.unit+')</label><input type="number" inputmode="decimal" step="0.5" value="'+(set.w===""?"":set.w)+'" data-k="w"/></div>'+
        '<div class="set-field"><label>Reps</label><input type="number" inputmode="numeric" value="'+(set.r===""?"":set.r)+'" data-k="r"/></div>'+
        '<button class="set-del">✕</button>';

      var wInput = row.querySelector('[data-k="w"]');
      var rInput = row.querySelector('[data-k="r"]');

      wInput.addEventListener("input", function(){
        set.w = wInput.value;
        var val = parseFloat(wInput.value) || 0;
        var nowPr = priorBest !== null && wInput.value !== "" && toKg(val, state.unit) > priorBest && val > 0;
        row.classList.toggle("is-pr", nowPr);
        persistDraft();
      });

      rInput.addEventListener("input", function(){
        set.r = rInput.value;
        persistDraft();
      });

      row.querySelector(".set-del").addEventListener("click", function(){
        var curIdx = Array.from(setsWrap.children).indexOf(row);
        if(curIdx > -1) draftSets.splice(curIdx, 1);
        if(!draftSets.length) draftSets.push({w:"", r:""});
        persistDraft();
        renderSets();
        renderStatsAndChart();
      });
      setsWrap.appendChild(row);
    });
  }

  document.getElementById("addSetBtn").addEventListener("click", function(){
    var lastSet = draftSets[draftSets.length-1];
    draftSets.push({w: (lastSet && lastSet.w !== "") ? lastSet.w : "", r: (lastSet && lastSet.r !== "") ? lastSet.r : ""});
    persistDraft();
    renderSets();
    startRestTimer();
  });

  function persistDraft(){
    var t = currentLogDate;
    var validSets = draftSets.filter(function(s){ 
      var wNum = parseFloat(s.w);
      var rNum = parseInt(s.r, 10);
      return s.w !== "" && s.r !== "" && !isNaN(wNum) && !isNaN(rNum); 
    }).map(function(s){ 
      return {w: parseFloat(s.w), r: parseInt(s.r, 10), unit: state.unit}; 
    });

    var arr = state.logs[currentEx.id] || (state.logs[currentEx.id] = []);
    var targetSess = arr.find(function(s){ return s.date === t; });
    
    if(!validSets.length){
      if(targetSess){ arr.splice(arr.indexOf(targetSess), 1); }
    } else if(targetSess){
      targetSess.sets = validSets;
    } else {
      arr.push({date: t, sets: validSets});
    }

    arr.sort(function(a, b){ return a.date.localeCompare(b.date); });
    save();
    renderStatsAndChart();
    if(planView.style.display === "block") renderPlanView();
  }

  function renderStatsAndChart(){
    var arr = (state.logs[currentEx.id] || []).slice();
    var bestKg = bestWeightFor(currentEx.id);
    document.getElementById("statBest").textContent = bestKg!==null ? round1(fromKg(bestKg,state.unit)) + " " + state.unit : "—";
    
    var lastNonCurrent = arr.filter(function(s){ return s.date !== currentLogDate; });
    var lastRef = lastNonCurrent.length ? lastNonCurrent[lastNonCurrent.length-1] : null;
    if(lastRef && lastRef.sets.length){
      var topSet = lastRef.sets.reduce(function(a,b){ return toKg(b.w,b.unit) > toKg(a.w,a.unit) ? b : a; });
      document.getElementById("statLast").textContent = round1(fromKg(toKg(topSet.w,topSet.unit),state.unit)) + "×" + topSet.r;
    } else {
      document.getElementById("statLast").textContent = "—";
    }

    var draftTop = draftSets.filter(function(s){ return s.w!=="" && !isNaN(parseFloat(s.w)) && parseFloat(s.w) > 0; })
      .reduce(function(a,b){ return (a===null || toKg(b.w,state.unit)>toKg(a.w,state.unit)) ? b : a; }, null);
    var priorBest = bestHistoricalWeightFor(currentEx.id, currentLogDate);
    var prBanner = document.getElementById("prBanner");

    if(draftTop && priorBest!==null && toKg(draftTop.w,state.unit) > priorBest){
      prBanner.style.display = "flex";
      document.getElementById("prBannerText").textContent = "New personal record — " + round1(parseFloat(draftTop.w)) + " " + state.unit + "!";
    } else if(draftTop && priorBest===null && parseFloat(draftTop.w) > 0){
      prBanner.style.display = "flex";
      document.getElementById("prBannerText").textContent = "First logged set for this exercise. Nice start!";
    } else {
      prBanner.style.display = "none";
    }

    var chartWrap = document.getElementById("chartWrap");
    var sessions = arr.slice(-8);
    if(!sessions.length){
      chartWrap.innerHTML = '<div class="hist-empty">Log a few sessions to see progress here.</div>';
      return;
    }
    var tops = sessions.map(function(s){
      var t = s.sets.reduce(function(a,b){ return toKg(b.w,b.unit) > toKg(a.w,a.unit) ? b : a; });
      return round1(fromKg(toKg(t.w,t.unit), state.unit));
    });
    var max = Math.max.apply(null, tops.concat([1]));
    var bars = tops.map(function(v){
      var h = Math.max(6, Math.round((v/max)*70));
      var isTop = v === Math.max.apply(null, tops);
      return '<div class="bar'+(isTop?" top":"")+'" style="height:'+h+'px" title="'+v+'"></div>';
    }).join("");
    var labels = sessions.map(function(s){ return '<span>'+fmtDateShort(s.date)+'</span>'; }).join("");
    chartWrap.innerHTML = '<div class="chart">'+bars+'</div><div class="chart-labels">'+labels+'</div>';
  }

  /* ---------------- Add exercise ---------------- */
  var addFab = document.getElementById("addExerciseFab");
  var newExCat = document.getElementById("newExCat");
  CATS.slice(1).forEach(function(c){
    var o = document.createElement("option"); o.value=c; o.textContent=c; newExCat.appendChild(o);
  });
  addFab.addEventListener("click", function(){
    document.getElementById("newExName").value = "";
    openSheet(addSheet);
  });
  document.getElementById("saveNewEx").addEventListener("click", function(){
    var name = document.getElementById("newExName").value.trim();
    if(!name) return;
    var id = "custom-" + name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"") + "-" + Date.now();
    state.customExercises.push({id:id, name:name, cat:newExCat.value});
    save();
    closeSheets();
    renderList();
  });

  /* ---------------- Rest timer ---------------- */
  var restToast = document.getElementById("restToast");
  var restTimeEl = document.getElementById("restTime");
  var restRingFg = document.getElementById("restRingFg");
  var CIRC = 106.8;
  var restInterval = null, restRemaining = 0, restTotal = 0;
  function startRestTimer(){
    clearInterval(restInterval);
    restTotal = state.restSeconds;
    restRemaining = restTotal;
    updateRestUI();
    restToast.classList.add("show");
    restInterval = setInterval(function(){
      restRemaining--;
      if(restRemaining <= 0){
        clearInterval(restInterval);
        restToast.classList.remove("show");
        if(navigator.vibrate) navigator.vibrate([120,60,120]);
        return;
      }
      updateRestUI();
    },1000);
  }
  function updateRestUI(){
    var m = Math.floor(restRemaining/60), s = restRemaining%60;
    restTimeEl.textContent = m + ":" + String(s).padStart(2,"0");
    var frac = restRemaining/restTotal;
    restRingFg.setAttribute("stroke-dashoffset", String(CIRC*(1-frac)));
  }
  document.getElementById("restSkip").addEventListener("click", function(){
    clearInterval(restInterval);
    restToast.classList.remove("show");
  });

  /* ---------------- Tabs ---------------- */
  var logView = document.getElementById("logView");
  var planView = document.getElementById("planView");
  Array.from(document.querySelectorAll(".tab")).forEach(function(tab){
    tab.addEventListener("click", function(){
      Array.from(document.querySelectorAll(".tab")).forEach(function(t){ t.classList.remove("active"); });
      tab.classList.add("active");
      if(tab.getAttribute("data-tab")==="plan"){
        logView.style.display = "none";
        planView.style.display = "block";
        renderPlanView();
      } else {
        planView.style.display = "none";
        logView.style.display = "block";
        renderTodayPlan();
      }
    });
  });

  /* ---------------- Today's plan strip (Log tab) ---------------- */
  function exById(id){ return allExercises().find(function(e){ return e.id===id; }); }
  function renderTodayPlan(){
    var idx = new Date().getDay();
    var ids = state.weeklyPlan[idx] || [];
    var wrap = document.getElementById("todayPlanWrap");
    var row = document.getElementById("todayPlanRow");
    if(!ids.length){ wrap.style.display = "none"; return; }
    wrap.style.display = "block";
    row.innerHTML = "";
    ids.forEach(function(id){
      var ex = exById(id);
      if(!ex) return;
      var chip = document.createElement("div");
      chip.className = "today-chip";
      chip.textContent = ex.name;
      chip.addEventListener("click", function(){ openDetail(ex, todayStr()); });
      row.appendChild(chip);
    });
  }

  /* ---------------- Weekly plan view & Individual Day Tables ---------------- */
  var PLAN_DAY_ORDER = [1,2,3,4,5,6,0];
  var DAY_NAMES_FULL = {0:"Sunday",1:"Monday",2:"Tuesday",3:"Wednesday",4:"Thursday",5:"Friday",6:"Saturday"};

  function getDateForDayIndex(targetDayIdx){
    var now = new Date();
    var currentDay = now.getDay();
    var currentMonIdx = (currentDay + 6) % 7;
    var targetMonIdx = (targetDayIdx + 6) % 7;
    var diffDays = targetMonIdx - currentMonIdx;
    var targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + diffDays);
    return targetDate.getFullYear()+"-"+String(targetDate.getMonth()+1).padStart(2,"0")+"-"+String(targetDate.getDate()).padStart(2,"0");
  }

  function renderPlanView(){
    var todayIdx = new Date().getDay();
    planView.innerHTML = "";

    PLAN_DAY_ORDER.forEach(function(dayIdx){
      var card = document.createElement("div");
      card.className = "day-card" + (dayIdx===todayIdx ? " is-today" : "");
      
      var dateStr = getDateForDayIndex(dayIdx);
      var head = document.createElement("div");
      head.className = "day-card-head";
      head.innerHTML = '<div class="day-name">'+DAY_NAMES_FULL[dayIdx]+' <span style="font-size:12px; font-weight:600; color:var(--text-dim);">('+fmtDateShort(dateStr)+')</span>'+(dayIdx===todayIdx?'<span class="today-dot"></span>':'')+'</div>';
      
      var labelInput = document.createElement("input");
      labelInput.className = "day-label-input";
      labelInput.placeholder = "e.g. Push day";
      labelInput.value = state.dayLabels[dayIdx] || "";
      labelInput.addEventListener("input", function(){ 
        state.dayLabels[dayIdx] = labelInput.value; 
        save(); 
      });
      head.appendChild(labelInput);
      card.appendChild(head);

      var ids = state.weeklyPlan[dayIdx] || [];
      if(ids.length){
        var chipsWrap2 = document.createElement("div");
        chipsWrap2.className = "day-chips";
        var tableRows = [];

        ids.forEach(function(id){
          var ex = exById(id);
          if(!ex) return;
          
          var chip = document.createElement("div");
          chip.className = "day-chip";
          
          var nameSpan = document.createElement("span");
          nameSpan.className = "day-chip-name";
          nameSpan.textContent = ex.name;
          chip.appendChild(nameSpan);

          var rm = document.createElement("button");
          rm.className = "day-chip-del";
          rm.textContent = "✕";
          rm.addEventListener("click", function(e){
            e.stopPropagation();
            state.weeklyPlan[dayIdx] = state.weeklyPlan[dayIdx].filter(function(x){ return x !== id; });
            save(); 
            renderPlanView(); 
            renderTodayPlan();
          });
          chip.appendChild(rm);

          chip.addEventListener("click", function(){
            openDetail(ex, dateStr);
          });
          chipsWrap2.appendChild(chip);

          var arr = state.logs[ex.id] || [];
          var daySession = arr.find(function(s){ return s.date === dateStr; });
          if(daySession && daySession.sets && daySession.sets.length > 0){
            var setsSummary = [];
            var topSetKg = 0;
            var topSetDisp = "";

            daySession.sets.forEach(function(s){
              var wKg = toKg(s.w, s.unit);
              var curDisp = round1(fromKg(wKg, state.unit));
              setsSummary.push(curDisp + "×" + s.r);
              if(wKg >= topSetKg){
                topSetKg = wKg;
                topSetDisp = curDisp + " " + state.unit + " × " + s.r;
              }
            });

            tableRows.push({
              name: ex.name,
              setsCount: daySession.sets.length,
              setsSummary: setsSummary.join(", "),
              top: topSetDisp
            });
          }
        });
        card.appendChild(chipsWrap2);

        if(tableRows.length > 0){
          var tableWrap = document.createElement("div");
          tableWrap.className = "day-table-wrap";
          var tHtml = '<table class="log-table">' +
            '<thead><tr><th>Exercise</th><th>Sets</th><th>Logged Sets ('+state.unit+')</th><th>Top Set</th></tr></thead>' +
            '<tbody>';
          tableRows.forEach(function(r){
            tHtml += 
              '<tr>' +
                '<td class="col-ex">'+escapeHtml(r.name)+'</td>' +
                '<td>'+r.setsCount+'</td>' +
                '<td class="col-sets">'+r.setsSummary+'</td>' +
                '<td class="col-top">'+r.top+'</td>' +
              '</tr>';
          });
          tHtml += '</tbody></table>';
          tableWrap.innerHTML = tHtml;
          card.appendChild(tableWrap);
        }
      } else {
        var empty = document.createElement("div");
        empty.className = "day-empty";
        empty.textContent = "Rest day — nothing scheduled yet.";
        card.appendChild(empty);
      }

      var addBtn = document.createElement("button");
      addBtn.className = "day-add-btn";
      addBtn.textContent = "+ Add exercise";
      addBtn.addEventListener("click", function(){ openPicker(dayIdx); });
      card.appendChild(addBtn);

      planView.appendChild(card);
    });
  }

  /* ---------------- Exercise picker ---------------- */
  var pickerList = document.getElementById("pickerList");
  var pickerSearch = document.getElementById("pickerSearch");
  var pickerDayIdx = null;
  function openPicker(dayIdx){
    pickerDayIdx = dayIdx;
    document.getElementById("pickerTitle").textContent = "Add to " + DAY_NAMES_FULL[dayIdx];
    pickerSearch.value = "";
    renderPickerList("");
    openSheet(pickerSheet);
  }
  function renderPickerList(term){
    var t = term.trim().toLowerCase();
    var items = allExercises().filter(function(ex){ return !t || ex.name.toLowerCase().indexOf(t)>-1; });
    pickerList.innerHTML = "";
    var current = state.weeklyPlan[pickerDayIdx] || [];
    items.forEach(function(ex){
      var row = document.createElement("div");
      row.className = "picker-row";
      var on = current.indexOf(ex.id) > -1;
      row.innerHTML =
        '<div><div class="pname">'+escapeHtml(ex.name)+'</div><div class="pcat">'+ex.cat+'</div></div>'+
        '<div class="picker-check'+(on?" on":"")+'">✓</div>';
      row.addEventListener("click", function(){
        var arr = state.weeklyPlan[pickerDayIdx] || (state.weeklyPlan[pickerDayIdx] = []);
        var pos = arr.indexOf(ex.id);
        if(pos > -1) arr.splice(pos,1); else arr.push(ex.id);
        save();
        renderPickerList(pickerSearch.value);
        renderPlanView();
        renderTodayPlan();
      });
      pickerList.appendChild(row);
    });
  }
  pickerSearch.addEventListener("input", function(){ renderPickerList(pickerSearch.value); });

  /* ---------------- Touch & Pointer Drag for Sheets ---------------- */
  function setupSheetDrag(sheetEl, dragHandles){
    var startY = 0, currentDelta = 0, isDragging = false;

    function start(y){
      isDragging = true;
      currentDelta = 0;
      startY = y;
      sheetEl.style.transition = "none";
    }

    function move(y){
      if(!isDragging) return;
      currentDelta = Math.max(0, y - startY);
      sheetEl.style.transform = "translateY(" + currentDelta + "px)";
    }

    function end(){
      if(!isDragging) return;
      isDragging = false;
      sheetEl.style.transition = "transform .28s cubic-bezier(.32,.72,0,1)";
      if(currentDelta > 100){
        closeSheets();
      } else {
        sheetEl.style.transform = "translateY(0)";
      }
    }

    dragHandles.forEach(function(h){
      if(!h) return;
      h.addEventListener("touchstart", function(e){
        var tag = (e.target.tagName || "").toLowerCase();
        if(tag==="button" || tag==="input" || tag==="select") return;
        start(e.touches[0].clientY);
      }, {passive:true});

      h.addEventListener("touchmove", function(e){
        if(!isDragging) return;
        move(e.touches[0].clientY);
        if(e.cancelable && currentDelta > 5) e.preventDefault();
      }, {passive:false});

      h.addEventListener("touchend", end);
      h.addEventListener("touchcancel", end);

      h.addEventListener("mousedown", function(e){
        var tag = (e.target.tagName || "").toLowerCase();
        if(tag==="button" || tag==="input" || tag==="select") return;
        start(e.clientY);
        function onMouseMove(ev){ move(ev.clientY); }
        function onMouseUp(){
          end();
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseup", onMouseUp);
        }
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
      });
    });
  }

  [detailSheet, addSheet, pickerSheet].forEach(function(sheetEl){
    var handle = sheetEl.querySelector(".sheet-handle");
    var head = sheetEl.querySelector(".sheet-head");
    setupSheetDrag(sheetEl, [handle, head]);
  });

  /* ---------------- Init ---------------- */
  renderList();
  renderTodayPlan();
})();
</script>
